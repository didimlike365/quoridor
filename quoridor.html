      <div class="pv">${pawnHTML(p, 'calc(1em + 10px)')}</div>
      <div class="pname">${nm}</div>
      <div class="goalhint">${p===0?'오른쪽 끝으로 →':'← 왼쪽 끝으로'}</div>
      <div class="timer idle"><svg viewBox="0 0 48 48"><circle class="trk" cx="24" cy="24" r="20"/><circle class="arc" cx="24" cy="24" r="20"/></svg><span class="tnum">대기</span></div>
      <div class="lbl"><span>남은 벽</span><b class="wcount">10</b></div>
      <div class="wbars">${'<i></i>'.repeat(10)}</div>
      <div class="lbl"><span>시간초과</span></div>
      <div class="strikes"><i></i><i></i><i></i></div>`;
  });
}
function updateHUD(){
  [0,1].forEach(p => {
    const el = $('#panel'+p);
    el.classList.toggle('active', p===G.turn && !G.over);
    el.querySelector('.wcount').textContent = G.wallsLeft[p];
    el.querySelectorAll('.wbars i').forEach((b,i) => b.classList.toggle('used', i >= G.wallsLeft[p]));
    el.querySelectorAll('.strikes i').forEach((s,i) => { const on = i < G.strikes[p]; s.classList.toggle('on', on); s.textContent = on?'✕':''; });
  });
  const p = G.turn;
  $('#turnBanner').innerHTML = G.over ? '게임 끝' :
    `<span class="dot" style="background:${S.players[p].color}"></span>${isAI(p) ? '컴퓨터가 생각 중…' : pname(p)+' 차례'}`;
  const human = !isAI(p) && !G.over;
  $('#btnMove').disabled = !human; $('#btnWall').disabled = !human || G.wallsLeft[p]===0;
  if (G.wallsLeft[p]===0 && G.action==='wall') G.action = 'move';
  $('#btnMove').setAttribute('aria-pressed', G.action==='move');
  $('#btnWall').setAttribute('aria-pressed', G.action==='wall');
  $('#btnRot').disabled = !human;
  $('#rotBar').className = 'bar '+G.orient; $('#rotTxt').textContent = G.orient==='H' ? '가로 벽' : '세로 벽';
  $('#hint').textContent = !human ? '' : G.action==='move'
    ? '반짝이는 칸을 눌러 말을 옮겨요'
    : (G.wallsLeft[p]===0 ? '벽을 다 썼어요' : '놓을 곳을 누르고 한 번 더 누르면 설치 · 마우스는 바로 클릭 · R키로 방향 바꾸기');
  drawHighlights();
}
function drawHighlights(){
  cellEls.forEach(c => c.classList.remove('can'));
  if (G.over || isAI(G.turn) || G.action!=='move') return;
  const col = S.players[G.turn].color;
  G.legal = legalMoves(G.pos, G.ws, G.turn);
  G.legal.forEach(m => { const c = cellEls[m.x*9+m.y]; c.classList.add('can'); c.style.setProperty('--hc', col); });
}

/* ================= 판 크기 맞추기 ================= */
const stage = $('#stage');
function fit(){
  if ($('#game').hidden) return;
  const w = stage.clientWidth, h = stage.clientHeight;
  const compact = w < 620 || h < 330;
  const pw = compact ? 72 : Math.min(160, Math.max(120, w*0.16));
  const sg = compact ? 12 : 26;
  const bs = Math.floor(Math.max(180, Math.min(w - 2*pw - 2*sg - 12, h - (land ? 16 : 24))));
  stage.classList.toggle('compact', compact);
  stage.style.setProperty('--pw', pw+'px'); stage.style.setProperty('--sg', sg+'px');
  document.documentElement.style.setProperty('--bs', bs+'px');
  pawnEls.forEach(e => e.firstElementChild.style.fontSize = (bs*0.046)+'px');
}
new ResizeObserver(fit).observe(stage);
window.addEventListener('resize', applyRot);
window.addEventListener('orientationchange', () => setTimeout(applyRot, 200));
document.addEventListener('fullscreenchange', applyRot);
document.addEventListener('webkitfullscreenchange', applyRot);

/* ================= 전체화면 ================= */
let fsUser = false;                      // 사용자가 전체화면 버튼으로 켰는지 (가로모드 해제 때 유지하려고)
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints > 1);
function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
async function enterFs(){
  const el = document.documentElement;
  try {
    if (el.requestFullscreen) await el.requestFullscreen({navigationUI:'hide'});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch(e){}
}
async function exitFs(){
  try {
    if (!isFs()) return;
    if (document.exitFullscreen) await document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  } catch(e){}
}
function syncFsBtns(){
  document.querySelectorAll('.fs-btn').forEach(b => {
    b.querySelector('.txt').textContent = isFs() ? '전체화면 끄기' : '전체화면';
    b.setAttribute('aria-label', isFs() ? '전체화면 끄기' : '전체화면');
  });
}
function fsFail(btn){
  const msg = isIOS ? '아이폰은 공유 → 홈 화면에 추가 후 열면 전체화면이 돼요' : '이 화면에서는 전체화면을 쓸 수 없어요';
  if (!$('#game').hidden) toast(msg, true);
  else { const t = btn.querySelector('.txt'); t.textContent = isIOS ? '홈 화면에 추가해 주세요' : '지원 안 됨'; setTimeout(syncFsBtns, 2200); }
}
async function toggleFs(e){
  const btn = e.currentTarget; sfx('click');
  if (isFs()){ fsUser = false; if (land) await setLand(false); await exitFs(); syncFsBtns(); return; }
  fsUser = true; await enterFs();
  setTimeout(() => { if (!isFs()){ fsUser = false; fsFail(btn); } syncFsBtns(); applyRot(); }, 350);
}
$('#sFs').onclick = toggleFs; $('#gFs').onclick = toggleFs;
['fullscreenchange','webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => {
  if (!isFs()){ fsUser = false; }
  syncFsBtns();
}));

/* ================= 가로모드 ================= */
let land = false;
const root = document.documentElement;
function applyRot(){
  const w = window.innerWidth, h = window.innerHeight;
  root.style.setProperty('--vw', w+'px'); root.style.setProperty('--vh', h+'px');
  // 가로모드인데 화면이 아직 세로면 CSS로 돌린다 (방향 고정이 된 기기는 돌리지 않음)
  root.classList.toggle('is-rotated', land && h > w);
  fit();
}
async function setLand(on){
  land = on;
  root.classList.toggle('is-land', on);
  $('#btnLand').textContent = on ? '세로모드' : '가로모드';
  const ctr = $('.controls');
  if (on) $('.gbar').insertBefore(ctr, $('.snd'));
  else $('#game').insertBefore(ctr, $('#toast'));
  applyRot();
  if (on){
    try { if (!document.fullscreenElement && root.requestFullscreen) await root.requestFullscreen({navigationUI:'hide'}); } catch(e){}
    try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch(e){}
  } else {
    try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e){}
    if (!fsUser) await exitFs();
  }
  applyRot();
}
$('#btnLand').onclick = () => { sfx('click'); setLand(!land); };

/* ================= 턴 / 타이머 ================= */
let tickTimer = null, aiTimer = null, lastSec = null;
function startTurn(first){
  clearInterval(tickTimer); clearTimeout(aiTimer);
  G.ghost = null; ghostEl.hidden = true;
  updateHUD(); drawPawns();
  const p = G.turn;
  if (!first) sfx('turn');
  if (isAI(p)){
    setTimer(p, null);
    const delay = 650 + Math.random()*650;
    aiTimer = setTimeout(() => {
      const a = aiChoose(p);
      if (a.type==='move') doMove(p, a); else doWall(p, a.o, a.x, a.y);
    }, delay);
    return;
  }
  G.deadline = performance.now() + S.turnSec*1000; lastSec = null;
  tickTimer = setInterval(onTick, 100); onTick();
}
function setTimer(p, left){
  [0,1].forEach(q => {
    const t = $('#panel'+q+' .timer'), arc = t.querySelector('.arc'), num = t.querySelector('.tnum');
    if (q !== p || left == null){
      t.className = 'timer idle'; arc.style.strokeDashoffset = q===p ? 0 : 125.66;
      num.textContent = q===p ? '생각 중' : '대기'; return;
    }
    const frac = Math.max(0, left/(S.turnSec*1000));
    arc.style.strokeDashoffset = (125.66*(1-frac)).toFixed(2);
    const sec = Math.ceil(left/1000);
    num.textContent = sec;
    t.className = 'timer' + (sec <= 5 ? ' warn' : '');
  });
}
function onTick(){
  const p = G.turn, left = G.deadline - performance.now();
  setTimer(p, Math.max(0,left));
  const sec = Math.ceil(left/1000);
  if (sec !== lastSec){ lastSec = sec; if (sec <= 5 && sec > 0) sfx('tick', sec <= 3); }
  if (left <= 0) onTimeout(p);
}
function onTimeout(p){
  clearInterval(tickTimer);
  G.strikes[p]++;
  sfx('timeout'); updateHUD();
  if (G.strikes[p] >= 3){ return endGame(1-p, 'timeout'); }
  toast(`${pname(p)} 시간 초과! (${G.strikes[p]}/3)`);
  G.turn = 1-p; G.action = 'move';
  setTimeout(() => { if (!G.over && !paused) startTurn(); }, 500);
}
function afterAction(p){
  clearInterval(tickTimer);
  G.turns++;
  if (G.pos[p].x === GOAL[p]) return endGame(p, 'goal');
  G.turn = 1-p; G.action = 'move';
  startTurn();
}
function doMove(p, m){
  G.pos[p] = {x:m.x, y:m.y};
  sfx(m.jump ? 'jump' : 'move');
  drawPawns(p);
  afterAction(p);
}
function doWall(p, o, x, y){
  const w = {o,x,y,p}; G.ws.add(o+x+','+y); G.walls.push(w); G.wallsLeft[p]--;
  addWallEl(w); sfx('wall');
  afterAction(p);
}

/* ================= 입력 ================= */
function boardPoint(e){
  const r = board.getBoundingClientRect();
  // 90도 돌린 화면에서는 화면 좌표를 보드 좌표로 되돌려 계산
  if (root.classList.contains('is-rotated'))
    return {ux:(e.clientY-r.top)/r.height*U, uy:(r.right-e.clientX)/r.width*U};
  return {ux:(e.clientX-r.left)/r.width*U, uy:(e.clientY-r.top)/r.height*U};
}
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function slotAt(pt){ return {x:clamp(Math.round((pt.ux-11.25)/ST),0,7), y:clamp(Math.round((pt.uy-11.25)/ST),0,7)}; }
function showGhost(s){
  G.ghost = {o:G.orient, x:s.x, y:s.y};
  G.ghost.ok = wallValid(G.ws, G.pos, G.orient, s.x, s.y);
  placeWallEl(ghostEl, G.orient, s.x, s.y);
  ghostEl.style.setProperty('--wc', S.players[G.turn].color);
  ghostEl.classList.toggle('bad', !G.ghost.ok); ghostEl.hidden = false;
}
function humanTurn(){ return G && !G.over && !paused && !isAI(G.turn) && !$('#game').hidden && $('#overlay').hidden; }
board.addEventListener('pointermove', e => {
  if (!humanTurn() || G.action!=='wall' || e.pointerType!=='mouse' || G.wallsLeft[G.turn]===0) return;
  showGhost(slotAt(boardPoint(e)));
});
board.addEventListener('pointerleave', e => { if (e.pointerType==='mouse' && G && G.action==='wall'){ ghostEl.hidden = true; G.ghost = null; } });
board.addEventListener('pointerdown', e => {
  if (!humanTurn()) return;
  e.preventDefault();
  const pt = boardPoint(e), p = G.turn;
  if (G.action === 'move'){
    const cx = clamp(Math.floor(pt.ux/ST),0,8), cy = clamp(Math.floor(pt.uy/ST),0,8);
    const m = (G.legal||[]).find(m => m.x===cx && m.y===cy);
    if (m) doMove(p, m); else sfx('invalid');
    return;
  }
  if (G.wallsLeft[p]===0){ sfx('invalid'); return; }
  const s = slotAt(pt);
  const same = G.ghost && G.ghost.x===s.x && G.ghost.y===s.y && G.ghost.o===G.orient;
  if (e.pointerType==='mouse' || same){
    if (!same) showGhost(s);
    if (G.ghost.ok) doWall(p, G.orient, s.x, s.y);
    else { sfx('invalid'); toast(wallFits(G.ws,G.orient,s.x,s.y) ? '길을 완전히 막을 수는 없어요' : '거기엔 벽을 놓을 수 없어요', true); }
  } else { showGhost(s); sfx('warnPlace'); }
});
board.addEventListener('contextmenu', e => { e.preventDefault(); if (humanTurn()) rotate(); });
function setAction(a){ if (!humanTurn()) return; if (a==='wall' && G.wallsLeft[G.turn]===0){ sfx('invalid'); return; } G.action = a; G.ghost=null; ghostEl.hidden = true; sfx('click'); updateHUD(); }
function rotate(){
  if (!humanTurn()) return;
  G.orient = G.orient==='H' ? 'V' : 'H';
  if (G.action !== 'wall' && G.wallsLeft[G.turn] > 0) G.action = 'wall';
  sfx('click');
  if (G.ghost) showGhost(G.ghost);
  updateHUD();
}
$('#btnMove').onclick = () => setAction('move');
$('#btnWall').onclick = () => setAction('wall');
$('#btnRot').onclick = rotate;
document.addEventListener('keydown', e => {
  if (!humanTurn()) return;
  if (e.key==='r' || e.key==='R'){ rotate(); }
  else if (e.key==='w' || e.key==='W'){ setAction(G.action==='wall'?'move':'wall'); }
});

/* ================= 시작 / 끝 ================= */
function newGame(){
  G = { pos:[{x:0,y:4},{x:8,y:4}], ws:new Set(), walls:[], wallsLeft:[10,10], strikes:[0,0],
        turn:0, over:false, action:'move', orient:'H', ghost:null, turns:0, legal:[] };
  $('#setup').hidden = true; $('#game').hidden = false; $('#overlay').hidden = true;
  $('#confetti').innerHTML = '';
  buildBoard(); buildPanels(); fit(); drawPawns();
  sfx('start'); playTrack(THEME_TRACK[S.theme]);
  setTimeout(() => startTurn(true), 250);
}
function endGame(winner, why){
  G.over = true; clearInterval(tickTimer); clearTimeout(aiTimer);
  setTimer(-1, null); updateHUD(); drawPawns();
  const humanLost = S.mode==='solo' && winner===1;
  sfx(humanLost ? 'lose' : 'win');
  if (!humanLost) confetti(S.players[winner].color);
  const reason = why==='goal'
    ? `${pname(winner)}이(가) 먼저 반대편 끝에 도착했어요.`
    : `${pname(1-winner)}이(가) 시간 초과를 3번 했어요.`;
  const title = S.mode==='solo' ? (winner===0 ? '이겼어요!' : '아쉽게 졌어요') : `${pname(winner)} 승리!`;
  setTimeout(() => openDialog(`
    <div class="big">${pawnHTML(winner,'52px')}</div>
    <h3>${title}</h3>
    <p>${reason}</p>
    <div class="stats"><div><b>${G.turns}</b>턴</div><div><b>${10-G.wallsLeft[0]}</b>P1 벽</div><div><b>${10-G.wallsLeft[1]}</b>${S.mode==='solo'?'컴퓨터':'P2'} 벽</div></div>
    <div class="row"><button class="start" id="dAgain" style="font-size:20px;padding:12px 26px;min-height:52px">한 판 더</button>
    <button class="gbtn" id="dSetup">설정 바꾸기</button></div>`,
    { dAgain: () => { sfx('click'); newGame(); }, dSetup: goSetup }), 700);
}
function goSetup(){
  clearInterval(tickTimer); clearTimeout(aiTimer);
  paused = false; $('#pause').hidden = true;
  if (S.music && !bgm.playing) startBgm();
  if (G) G.over = true;
  if (land) setLand(false);
  $('#overlay').hidden = true; $('#game').hidden = true; $('#setup').hidden = false;
  renderSetup(); sfx('click');
}
function openDialog(html, handlers){
  $('#dialog').innerHTML = html; $('#overlay').hidden = false;
  Object.entries(handlers).forEach(([id,fn]) => { const b = document.getElementById(id); if (b) b.onclick = fn; });
}
let pausedLeft = null;
/* ---- 일시정지 ---- */
let paused = false, pauseLeft = null, pauseMusic = false;
function pauseGame(){
  if (!G || G.over || paused || $('#game').hidden || !$('#overlay').hidden) return;
  paused = true;
  clearInterval(tickTimer); clearTimeout(aiTimer);
  pauseLeft = isAI(G.turn) ? null : Math.max(0, G.deadline - performance.now());
  pauseMusic = bgm.playing; stopBgm();
  G.ghost = null; ghostEl.hidden = true;
  $('#pause').hidden = false; sfx('click');
  $('#btnResume').focus();
}
function resumeGame(){
  if (!paused) return;
  paused = false; $('#pause').hidden = true; sfx('click');
  if (pauseMusic) startBgm();
  if (pauseLeft == null || pauseLeft < 300) startTurn(true);
  else { G.deadline = performance.now() + pauseLeft; lastSec = null; tickTimer = setInterval(onTick, 100); onTick(); }
  updateHUD();
}
$('#btnPause').onclick = pauseGame;
$('#btnResume').onclick = resumeGame;
$('#btnPauseHome').onclick = goSetup;
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
document.addEventListener('keydown', e => {
  if (e.key==='p' || e.key==='P' || e.key==='Escape'){ if (paused) resumeGame(); else pauseGame(); }
});
$('#btnHome').onclick = () => {
  if (!G || G.over){ goSetup(); return; }
  sfx('click');
  // 확인하는 동안 시계를 멈춰 둔다
  clearInterval(tickTimer); clearTimeout(aiTimer);
  pausedLeft = isAI(G.turn) ? null : G.deadline - performance.now();
  openDialog(`<h3>그만할까요?</h3><p>지금 게임은 끝나고 설정 화면으로 돌아가요.</p>
    <div class="row"><button class="gbtn" id="dYes">그만하기</button><button class="start" id="dNo" style="font-size:20px;padding:12px 26px;min-height:52px">계속하기</button></div>`,
    { dYes: goSetup, dNo: () => {
        $('#overlay').hidden = true; sfx('click');
        if (pausedLeft == null) startTurn(true);
        else { G.deadline = performance.now() + pausedLeft; tickTimer = setInterval(onTick, 100); }
      } });
};
$('#btnStart').onclick = () => { ensureAudio(); newGame(); };

let toastT = null;
function toast(msg, info){
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('info', !!info); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600);
}
function confetti(main){
  const box = $('#confetti'); box.innerHTML = '';
  const cols = [main, ...COLORS];
  for (let i=0;i<70;i++){
    const c = document.createElement('i');
    c.style.left = (Math.random()*100)+'%'; c.style.background = cols[i%cols.length];
    c.style.animationDuration = (1.8+Math.random()*1.8)+'s'; c.style.animationDelay = (Math.random()*0.6)+'s';
    box.appendChild(c);
  }
  setTimeout(() => box.innerHTML='', 4500);
}

S.track = THEME_TRACK[S.theme] || 'kids';
syncSoundBtns(); syncFsBtns(); renderSetup();
})();
</script>
